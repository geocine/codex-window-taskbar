[package]
name = "codex-windows-taskbar"
version = "0.1.6"
edition = "2021"
license = "MIT"
description = "codex-windows-taskbar"
repository = "https://github.com/geocine/codex-windows-taskbar"

[package.metadata.winres]
CompanyName = "geocine"
ProductName = "codex-windows-taskbar"
FileDescription = "codex-windows-taskbar"
OriginalFilename = "codex-windows-taskbar.exe"
InternalName = "CodexWindowsTaskbar"
LegalCopyright = "Copyright (C) 2026 geocine"

[dependencies]
ureq = { version = "2", default-features = false, features = ["native-tls", "json", "proxy-from-env"] }
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_Security",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
]

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
